<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafity Artes – Barbearia</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EAD6;--paper:#FFFBF1;--ink:#14213D;--mut:#5B6580;--red:#C8202F;--gold:#E3A72F;--navy:#14213D;--on-navy:#F3EAD6;--green:#1E9E57;--line:#14213D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1630;--paper:#17234A;--ink:#F3EAD6;--mut:#A8B1CC;--line:#4A5B94;--navy:#0A1126;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1630;--paper:#17234A;--ink:#F3EAD6;--mut:#A8B1CC;--line:#4A5B94;--navy:#0A1126;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(rgba(127,127,127,.18) 1px,transparent 1.5px) 0 0/16px 16px,var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:0 16px 40px}
a{color:inherit}button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{font-weight:400;font-family:'Bebas Neue',Impact,sans-serif}
h2{font-size:28px;line-height:1;letter-spacing:1px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.n{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.note{color:var(--mut);font-size:14px;margin:4px 0}
.err{color:var(--red);font-weight:800;margin:6px 0}
label{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
input,select{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:4px 0 12px}
input[type=date]{color-scheme:inherit}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px;padding:10px 16px;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:12px}
header.app img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold)}
.who{flex:1;line-height:1.15}.who b{display:block;font-size:17px}.who span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:800}
.out{background:none;border:1.5px solid rgba(243,234,214,.5);color:var(--on-navy);border-radius:99px;padding:6px 14px;font-weight:700}
.ribbon{height:8px;margin:0 -16px;background:repeating-linear-gradient(135deg,#C8202F 0 12px,#fff 12px 24px,#1F4FB5 24px 36px,#fff 36px 48px);background-size:68px 100%;animation:pole 2.4s linear infinite}
@keyframes pole{to{background-position:68px 0}}
@media (prefers-reduced-motion:reduce){.ribbon{animation:none}}
.prog{display:flex;gap:6px;margin:16px 0 0}.prog i{flex:1;height:8px;border-radius:99px;background:var(--line);opacity:.25}.prog i.f{background:var(--red);opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:84px;box-shadow:4px 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.tile.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy);box-shadow:4px 4px 0 var(--red)}
.tn{font-weight:800}.tp{font:400 28px/1.1 'Bebas Neue',Impact,sans-serif;color:var(--red);letter-spacing:.5px}.tile.on .tp{color:var(--gold)}.tm{font-size:13px;color:var(--mut)}.tile.on .tm{color:#c9cee0}
.bt{flex-direction:row;align-items:center;gap:10px;min-height:68px}
.av{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:400 24px 'Bebas Neue',Impact,sans-serif;flex:none}.tile.on .av{background:var(--gold);color:var(--navy)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.slot{padding:11px 0;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-weight:800}
.slot.on{background:var(--red);border-color:var(--red);color:#fff}.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.resumo{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:6px 14px;margin-top:22px}
.r2{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.r2:last-child{border:0}
.btn{width:100%;min-height:52px;border:2px solid var(--navy);border-radius:12px;font:400 22px 'Bebas Neue',Impact,sans-serif;letter-spacing:1px;color:#fff;box-shadow:0 4px 0 var(--navy);padding:0 18px;background:var(--red)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.green{background:var(--green)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;margin-top:10px}
.btn.sm{min-height:42px;font-size:18px;width:auto;flex:1;margin:0}
.dock{position:sticky;bottom:0;margin:22px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);display:flex;gap:14px;align-items:center;border-top:3px solid var(--gold)}
.dock small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:800}.dock b{font:400 34px/1 'Bebas Neue',Impact,sans-serif}.dock .btn{flex:1;border-color:#000;box-shadow:0 4px 0 #000}
.lg{margin:0 -16px}
.hero{position:relative;height:270px;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 84%,0 100%);background:var(--navy)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 70%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,17,38,.1),rgba(10,17,38,.65))}
.sheet{margin-top:-70px;position:relative;padding:0 16px;text-align:center}
.seal{width:124px;height:124px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 0 4px var(--navy),0 12px 28px rgba(0,0,0,.4);display:block;margin:0 auto}
h1{font-size:60px;line-height:.95;letter-spacing:2px;margin:14px 0 4px}h1 em{color:var(--red);font-style:normal}
.sub{color:var(--mut);font-weight:800;letter-spacing:1.5px;margin:0 0 14px;text-transform:uppercase;font-size:13px}
.lg .ribbon{margin:0 auto 20px;max-width:220px;border-radius:99px}
.ticket{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:6px 6px 0 var(--red)}
.stub{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;margin:20px 0 18px;box-shadow:6px 6px 0 var(--gold)}
.c{text-align:center;justify-content:center}.stub h2{margin:12px 0 2px}
.perf{border-top:3px dotted var(--line);margin:12px -4px}
.okc{width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:42px;box-shadow:0 0 0 6px rgba(30,158,87,.25)}
.tot{font:400 46px/1 'Bebas Neue',Impact,sans-serif;color:var(--red);text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 0;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.tabs button{min-height:48px;background:var(--paper);color:var(--ink);border:0;font:400 22px 'Bebas Neue',Impact,sans-serif;letter-spacing:1px}.tabs button.on{background:var(--navy);color:var(--gold)}
.strip{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:4px 16px 10px;scrollbar-width:none}
.day{flex:none;width:58px;padding:8px 0;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center}
.day small{text-transform:uppercase;font-size:11px;font-weight:800;color:var(--mut)}.day b{font:400 28px/1 'Bebas Neue',Impact,sans-serif}
.day.on{background:var(--red);border-color:var(--red);color:#fff}.day.on small{color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800}.chip.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font:400 30px/1 'Bebas Neue',Impact,sans-serif;color:var(--gold)}.stats small{font-size:11px;letter-spacing:1px;text-transform:uppercase}
.bk{display:flex;gap:12px;margin:12px 0}
.bk .t{flex:none;width:74px;text-align:center;font:400 30px/1 'Bebas Neue',Impact,sans-serif;background:var(--red);color:#fff;border-radius:14px;padding:12px 0;align-self:flex-start}
.bk .bd{flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;box-shadow:4px 4px 0 var(--line)}
.bk.ok .t{background:var(--green)}.bk.cx{opacity:.55}.bk.cx .t{background:var(--mut)}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:center}.l1 b{font-size:18px}.l2{margin:2px 0 8px}
.l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pay{background:rgba(227,167,47,.28);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800}
.wa{margin-left:auto;color:var(--green);font-weight:800;text-decoration:none;border:2px solid var(--green);border-radius:99px;padding:2px 10px;font-size:13px}
.acts{display:flex;gap:8px;margin-top:10px}
.st{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--gold);color:#14213D;white-space:nowrap}.st.x{background:var(--mut);color:#fff}.st.ok{background:var(--green);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 0;font-weight:700;border:2px dashed var(--line);border-radius:14px;margin-top:12px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;box-shadow:4px 4px 0 var(--line)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.li button{background:none;border:0;color:var(--red);font-weight:800;text-decoration:underline;padding:6px}
.addrow{display:grid;gap:8px;margin-top:12px}.addrow input,.addrow select{margin:0}.addrow .btn{margin:0}
</style>
</head>

let S=JSON.parse(JSON.stringify(DEF)),dbDoc=null,me=null,tab="ag",view="home",user=null,admin=false,step=1,B={},done=null,msg="",fAdm={date:today(),barber:""};
const $=id=>document.getElementById(id);
const R=n=>"R$ "+Number(n).toFixed(2).replace(".",",");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return d.split("-").reverse().join("/")}
const uid=()=>Math.random().toString(36).slice(2,9);
const svc=id=>S.services.find(x=>x.id==id)||{name:"?",price:0};
const bar=id=>S.barbers.find(x=>x.id==id)||{name:"?"};

const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.error||"Erro"),{status:r.status});return d};
const bq=()=>"/api/admin/bookings?date="+fAdm.date+(fAdm.barber?"&barber="+fAdm.barber:"");
async function loadCfg(){const c=await api("GET","/api/config");S.wa=c.wa;S.barbers=c.barbers;S.services=c.services}
async function loadBookings(){S.bookings=(await api("GET",bq())).bookings}
async function loadAdmin(){const a=await api("GET","/api/admin/state");S.wa=a.wa;S.barbers=a.barbers;S.services=a.services;S.admins=a.admins;me={role:a.owner?"dono":"barbeiro",barber:a.barber};await loadBookings()}
async function loadSlots(){S.bookings=B.b&&B.d?(await api("GET","/api/slots?barber="+B.b+"&date="+B.d)).slots:[]}
async function save(){try{await api("PUT","/api/admin/config",{wa:S.wa,barbers:S.barbers,services:S.services});await loadAdmin()}catch(e){msg="Não foi possível salvar. Confira os dados."}}
async function init(){try{await loadCfg();const m=await api("GET","/api/me");user=m.name;admin=m.role=="admin";if(admin)await loadAdmin();else B={name:m.name,phone:m.phone}}catch(e){}render()}
function taken(b,d,t){return S.bookings.some(x=>x.barber==b&&x.date==d&&x.time==t&&x.status!="cancelado")}

function render(){
  const a=$("app");
  a.innerHTML=head()+(!user?login():admin?adminView():client());
  bind();
}
function head(){if(!user)return "";const role=admin?(me&&me.role=="barbeiro"?"Barbeiro":"Dono"):"Cliente";return `<header class="app"><img src="${LOGO}" alt=""><div class="who"><b>${esc(user)}</b><span>${role}</span></div><button class="out" data-a="out">Sair</button></header><div class="ribbon"></div>`}
const PI={"Pix":"⚡","Cartão de crédito":"💳","Cartão de débito":"💳","Dinheiro":"💵"};
function client(){
  if(done)return confirmView();
  const sv=svc(B.s),tot=B.s?sv.price:0,st4=[B.s,B.b,B.d&&B.t,B.p];
  let h=`<div class="prog">${st4.map(v=>`<i class="${v?"f":""}"></i>`).join("")}</div><h2 style="margin-top:18px">Monte seu horário</h2><p class="note" style="margin-top:-6px">Escolha o serviço, o barbeiro e o horário.</p>`;
  h+=`<h2><i class="n">1</i>Serviço</h2><div class="tiles">${S.services.map(s=>`<button class="tile ${B.s==s.id?"on":""}" data-s="${s.id}"><span class="tn">${esc(s.name)}</span><span class="tp">${R(s.price)}</span><span class="tm">${s.min} min</span></button>`).join("")}</div>`;
  h+=`<h2><i class="n">2</i>Barbeiro</h2><div class="tiles">${S.barbers.map(b=>`<button class="tile bt ${B.b==b.id?"on":""}" data-b="${b.id}"><span class="av">${esc(b.name.trim().charAt(0).toUpperCase())}</span><span class="tn">${esc(b.name)}</span></button>`).join("")}</div>`;
  h+=`<h2><i class="n">3</i>Dia e horário</h2><input type="date" id="cd" min="${today()}" value="${B.d||""}">`;
  if(B.b&&B.d)h+=`<div class="slots">${HOURS.map(t=>{const tk=taken(B.b,B.d,t)||(B.d==today()&&t<=new Date().toTimeString().slice(0,5));return `<button class="slot ${B.t==t?"on":""}" data-t="${t}" ${tk?"disabled":""}>${t}</button>`}).join("")}</div>`;
  else h+=`<p class="note">Escolha o barbeiro e o dia para ver os horários livres.</p>`;
  h+=`<h2><i class="n">4</i>Pagamento</h2><div class="tiles">${PAY.map(p=>`<button class="tile bt ${B.p==p?"on":""}" data-p="${p}"><span class="tn">${PI[p]||""} ${p}</span></button>`).join("")}</div>`;
  h+=`<div class="resumo"><div class="r2"><span>Serviço</span><b>${B.s?esc(sv.name):"—"}</b></div><div class="r2"><span>Barbeiro</span><b>${B.b?esc(bar(B.b).name):"—"}</b></div><div class="r2"><span>Quando</span><b>${B.d&&B.t?fmt(B.d)+" às "+B.t:"—"}</b></div><div class="r2"><span>Pagamento</span><b>${B.p||"—"}</b></div></div>`;
  h+=`<p class="err">${esc(msg)}</p><div class="dock"><div><small>TOTAL</small><b>${R(tot)}</b></div><button class="btn" data-a="book">Confirmar</button></div>`;
  return h;
}
function waText(x){return `Olá, Grafity Artes! Novo agendamento:\n• Cliente: ${x.client} (${x.phone})\n• Serviço: ${svc(x.service).name} – ${R(svc(x.service).price)}\n• Barbeiro: ${bar(x.barber).name}\n• Data: ${fmt(x.date)} às ${x.time}\n• Pagamento: ${x.pay}`}
function waLink(x){return "https://wa.me/"+S.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(waText(x))}
function confirmView(){const x=done;return `<div class="stub"><div class="okc">✓</div><h2 class="c">Horário reservado!</h2><p class="note c" style="text-align:center">Guarde este comprovante</p><div class="perf"></div><div class="r2"><span>Serviço</span><b>${esc(svc(x.service).name)}</b></div><div class="r2"><span>Barbeiro</span><b>${esc(bar(x.barber).name)}</b></div><div class="r2"><span>Quando</span><b>${fmt(x.date)} às ${x.time}</b></div><div class="r2"><span>Pagamento</span><b>${esc(x.pay)}</b></div><div class="perf"></div><div class="tot">${R(svc(x.service).price)}</div></div>
${x.sent?"<p class=\"note\" style=\"text-align:center\">A barbearia já recebeu o seu agendamento no WhatsApp.</p>":"<p class=\"note\" style=\"text-align:center\">Falta um passo: envie a mensagem para o WhatsApp da barbearia.</p>"}<a href="${waLink(x)}" target="_blank" rel="noopener"><button class="btn green">Enviar no WhatsApp</button></a><p class="err">${esc(msg)}</p><button class="btn ghost" data-a="new">Novo agendamento</button>`}
function login(){return `<section class="lg"><div class="hero"><img src="${FOTO}" alt=""><div class="shade"></div></div><div class="sheet"><img class="seal" src="${LOGO}" alt="Grafity Artes"><h1>GRAFITY <em>ARTES</em></h1><p class="sub">Barbearia · agende seu horário</p><div class="ribbon"></div><div class="ticket"><label for="ln">Seu nome</label><input id="ln" autocomplete="name" value="${esc(B.ln||"")}"><label for="ls">WhatsApp</label><input id="ls" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="(62) 99999-9999"><p class="err">${esc(msg)}</p><button class="btn" data-a="in">Entrar e agendar</button></div></div></section>`}
function adminView(){
  const owner=!!me&&(!me.role||me.role=="dono"),bf=owner?fAdm.barber:(me&&me.barber)||"none";
  const list=S.bookings.filter(x=>x.date==fAdm.date&&(!bf||x.barber==bf)).sort((a,b)=>a.time<b.time?-1:1);
  let h="";
  if(owner)h+=`<nav class="tabs"><button class="${tab=="ag"?"on":""}" data-tab="ag">Agenda</button><button class="${tab=="cfg"?"on":""}" data-tab="cfg">Configurações</button></nav>`;
  if(!owner||tab!="cfg"){
    const days=[...Array(10)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString("sv-SE")});
    h+=`<h2>${owner?"Agenda":"Seus clientes"}</h2><div class="strip">${days.map(d=>{const dt=new Date(d+"T12:00:00");return `<button class="day ${fAdm.date==d?"on":""}" data-day="${d}"><small>${dt.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")}</small><b>${dt.getDate()}</b></button>`}).join("")}</div><input type="date" id="fd" value="${fAdm.date}">`;
    if(owner)h+=`<div class="chips"><button class="chip ${!fAdm.barber?"on":""}" data-fb="">Todos</button>${S.barbers.map(b=>`<button class="chip ${fAdm.barber==b.id?"on":""}" data-fb="${b.id}">${esc(b.name)}</button>`).join("")}</div>`;
    h+=`<div class="stats"><div><b>${list.filter(x=>x.status=="agendado").length}</b><small>Agendados</small></div><div><b>${list.filter(x=>x.status=="concluído").length}</b><small>Concluídos</small></div><div><b>${R(list.filter(x=>x.status=="concluído").reduce((s,x)=>s+x.price,0))}</b><small>Faturado</small></div></div>`;
    h+=list.length?list.map(x=>{const c={agendado:"ag",concluído:"ok",cancelado:"cx"}[x.status]||"ag";return `<article class="bk ${c}"><div class="t">${x.time}</div><div class="bd"><div class="l1"><b>${esc(x.client)}</b><span class="st ${c=="cx"?"x":c=="ok"?"ok":""}">${x.status}</span></div><div class="l2">${esc(x.serviceName||"")} · <b>${R(x.price)}</b></div><div class="l3"><span class="pay">${esc(x.pay)}</span>${owner?`<span class="pay">${esc(x.barberName||"")}</span>`:""}<a class="wa" href="https://wa.me/${x.phone.replace(/\D/g,"").replace(/^(\d{10,11})$/,"55$1")}" target="_blank" rel="noopener">WhatsApp</a></div>${x.status=="agendado"?`<div class="acts"><button class="btn green sm" data-ok="${x.id}">Concluir</button><button class="btn ghost sm" data-cx="${x.id}">Cancelar</button></div>`:""}</div></article>`}).join(""):`<div class="empty">Nenhum agendamento neste dia.</div>`;
  }else{
    h+=`<p class="err">${esc(msg)}</p><h2>WhatsApp da loja</h2><div class="panel"><label>Número (55 + DDD + número)</label><input id="sw" value="${esc(S.wa)}" inputmode="tel"><button class="btn" data-a="cfg">Salvar</button></div>`;
    h+=`<h2>Barbeiros</h2><div class="panel">${S.barbers.map(b=>`<div class="li"><span>${esc(b.name)}</span><button data-rb="${b.id}">remover</button></div>`).join("")}<div class="addrow"><input id="nb" placeholder="Nome do barbeiro"><button class="btn" data-a="ab">Adicionar barbeiro</button></div></div>`;
    h+=`<h2>Serviços e preços</h2><div class="panel">${S.services.map(s=>`<div class="li"><span>${esc(s.name)} · <b>${R(s.price)}</b></span><button data-rs="${s.id}">remover</button></div>`).join("")}<div class="addrow"><input id="ns" placeholder="Serviço"><input id="np" placeholder="Preço, ex.: 35,50" inputmode="decimal"><button class="btn" data-a="as">Adicionar serviço</button></div></div>`;
    h+=`<h2>Logins da equipe</h2><div class="panel"><p class="note">Quem tem login aqui entra como equipe. Senha com 8 caracteres ou mais, com letras e números. Remova quem sair.</p>${S.admins.map(a=>`<div class="li"><span>${esc(a.name)} <small class="note">(${a.role=="barbeiro"?"barbeiro: "+esc(bar(a.barber).name):"dono"})</small></span><button data-ra="${esc(a.name)}">remover</button></div>`).join("")}<div class="addrow"><input id="an" placeholder="Nome de login"><input id="ap" type="password" placeholder="Senha" autocomplete="new-password"><select id="av"><option value="">Dono (acesso total)</option>${S.barbers.map(b=>`<option value="${b.id}">Barbeiro: ${esc(b.name)}</option>`).join("")}</select><button class="btn" data-a="aa">Adicionar login</button></div></div>`;
  }
  return h;
}

function bind(){
  const q=s=>document.querySelectorAll(s);
  const keep=()=>{if($("cn"))B.name=$("cn").value;if($("cp"))B.phone=$("cp").value};
  q("[data-a]").forEach(e=>e.onclick=async()=>{
    const a=e.dataset.a;msg="";
    if(a=="home"){view="home";done=null}
    else if(a=="client"){view="client"}
    else if(a=="adm"){view="adm"}
    else if(a=="new"){B={};done=null}
    else if(a=="in"){const n=$("ln").value.trim(),sc=$("ls").value.trim();B.ln=n;
      try{const r=await api("POST","/api/login",{name:n,secret:sc});user=r.name;admin=r.role=="admin";if(admin){B={};await loadAdmin()}else B={name:r.name,phone:r.phone}}
      catch(e){msg=e.status==429?"Muitas tentativas. Aguarde alguns minutos.":"Confira seu nome e seu WhatsApp com DDD."}}
    else if(a=="out"){await api("POST","/api/logout").catch(()=>{});admin=false;user=null;me=null;B={};done=null}
    else if(a=="book"){keep();
      if(!B.name||!B.phone||!B.s||!B.b||!B.d||!B.t||!B.p){msg="Preencha nome, WhatsApp, serviço, barbeiro, horário e pagamento."}
      else if(taken(B.b,B.d,B.t)){msg="Esse horário acabou de ser ocupado. Escolha outro.";B.t=""}
      else{try{done=(await api("POST","/api/book",{service:B.s,barber:B.b,date:B.d,time:B.t,pay:B.p})).booking}catch(err){if(err.status==409){msg="Esse horário acabou de ser ocupado. Escolha outro.";B.t="";await loadSlots()}else msg="Não foi possível agendar. Tente de novo."}}}
    else if(a=="cfg"){S.wa=$("sw").value.replace(/\D/g,"")||S.wa;await save()}
    else if(a=="aa"){try{await api("POST","/api/admin/users",{name:$("an").value.trim(),pass:$("ap").value,barber:$("av").value});await loadAdmin()}catch(err){msg=err.message}}
    else if(a=="ab"){const v=$("nb").value.trim();if(!v)msg="Digite o nome do barbeiro.";else{S.barbers.push({id:uid(),name:v});await save()}}
    else if(a=="as"){const v=$("ns").value.trim(),p=parseFloat($("np").value.replace(/[^\d,.]/g,"").replace(",","."));if(!v)msg="Digite o nome do serviço.";else if(isNaN(p))msg="Digite o preço, por exemplo 35 ou 35,50.";else{S.services.push({id:uid(),name:v,price:p,min:30});await save()}}
    render();
  });
  q("[data-s]").forEach(e=>e.onclick=()=>{keep();B.s=e.dataset.s;render()});
  q("[data-b]").forEach(e=>e.onclick=async()=>{keep();B.b=e.dataset.b;B.t="";await loadSlots();render()});
  q("[data-t]").forEach(e=>e.onclick=()=>{keep();B.t=e.dataset.t;render()});
  q("[data-p]").forEach(e=>e.onclick=()=>{keep();B.p=e.dataset.p;render()});
  q("[data-ok]").forEach(e=>e.onclick=async()=>{try{await api("PATCH","/api/admin/bookings/"+e.dataset.ok,{status:"concluído"});await loadBookings()}catch(err){}render()});
  q("[data-cx]").forEach(e=>e.onclick=async()=>{try{await api("PATCH","/api/admin/bookings/"+e.dataset.cx,{status:"cancelado"});await loadBookings()}catch(err){}render()});
  q("[data-rb]").forEach(e=>e.onclick=async()=>{if(S.barbers.length>1){S.barbers=S.barbers.filter(x=>x.id!=e.dataset.rb);await save();render()}});
  q("[data-rs]").forEach(e=>e.onclick=async()=>{if(S.services.length>1){S.services=S.services.filter(x=>x.id!=e.dataset.rs);await save();render()}});
  q("[data-ra]").forEach(e=>e.onclick=async()=>{try{await api("DELETE","/api/admin/users/"+encodeURIComponent(e.dataset.ra));await loadAdmin()}catch(err){msg=err.message}render()});
  if($("ls")){$("ls").oninput=e=>{e.target.type=/[a-z]/i.test(e.target.value)?"password":"text"};["ln","ls"].forEach(i=>$(i).onkeydown=e=>{if(e.key=="Enter")document.querySelector("[data-a=in]").click()})}
  q("[data-tab]").forEach(e=>e.onclick=()=>{tab=e.dataset.tab;msg="";render()});
  q("[data-day]").forEach(e=>e.onclick=async()=>{fAdm.date=e.dataset.day;await loadBookings();render()});
  q("[data-fb]").forEach(e=>e.onclick=async()=>{fAdm.barber=e.dataset.fb;await loadBookings();render()});
  if($("cd"))$("cd").onchange=async ev=>{keep();B.d=ev.target.value;B.t="";await loadSlots();render()};
  if($("fd"))$("fd").onchange=async ev=>{fAdm.date=ev.target.value;await loadBookings();render()};
  if($("fb"))$("fb").onchange=async ev=>{fAdm.barber=ev.target.value;await loadBookings();render()};
}
init();
</script>
</body>
</html>
